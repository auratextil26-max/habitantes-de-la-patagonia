<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{width:100%;height:100%;margin:0;overflow:hidden}img{max-width:none!important}.leaflet-container{font:13px Arial,sans-serif}#status{position:absolute;top:9px;left:9px;right:58px;z-index:900;background:rgba(255,255,255,.94);border-radius:4px;padding:8px 10px;color:#263c30;font:12px/1.4 Arial,sans-serif;pointer-events:none}.leaflet-popup-content a{color:#246044} .map-toggle{position:absolute;bottom:24px;left:10px;z-index:950;background:#fff;border:1px solid #b8c6bc;border-radius:7px;padding:9px 11px;font:12px Arial,sans-serif;box-shadow:0 2px 8px #0002;max-width:calc(100% - 20px)}.map-toggle label{display:flex;align-items:center;gap:8px;cursor:pointer}.map-toggle input{width:17px;height:17px;accent-color:#b65e45}.map-toggle small{display:block;margin-top:5px;color:#54695c}.map-key{display:inline-block;width:12px;height:12px;border-radius:50%;background:#c86d50;border:1px solid #873d30}</style></head><body><div id="map"></div><div id="status" role="status">Cargando registros de biodiversidad…</div><div class="map-toggle"><label><input type="checkbox" id="show-records" checked><span class="map-key"></span><strong>Registros de avistamiento (GBIF)</strong></label><small>● Toca un punto para ver su fuente</small><label style="margin-top:7px"><input type="checkbox" id="show-habitat" checked><span style="color:#214b3d;font-size:17px">◆</span><strong>Hábitat de referencia</strong></label><small>◆ Punto ilustrativo, no avistamiento</small><small>▧ Área de distribución: pendiente de datos verificados</small></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(async()=>{
const names={'flamenco':'Phoenicopterus chilensis','puma':'Puma concolor','condor':'Vultur gryphus','guanaco':'Lama guanicoe','carpintero-negro':'Campephilus magellanicus','martin-pescador':'Megaceryle torquata'};
const slug=new URLSearchParams(location.search).get('species')||'flamenco';const name=names[slug];const status=document.getElementById('status');if(!name||!window.L){status.textContent='Mapa no disponible';return}
const map=L.map('map',{scrollWheelZoom:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);
const recordsLayer=L.layerGroup().addTo(map);document.getElementById('show-records').addEventListener('change',e=>{if(e.target.checked)recordsLayer.addTo(map);else map.removeLayer(recordsLayer)});
const habitatPoints={"flamenco":[-51.2,-70.6,"Lagunas y humedales"],"puma":[-50.95,-73.1,"Estepa y montaña"],"condor":[-50.95,-73.4,"Cordillera y riscos"],"guanaco":[-52.4,-70.8,"Estepa abierta"],"carpintero-negro":[-54.6,-68.5,"Bosque austral"],"martin-pescador":[-45.55,-72.1,"Ríos y lagos"]};const h=habitatPoints[slug];const habitatLayer=L.layerGroup().addTo(map);if(h){const icon=L.divIcon({className:'habitat-icon',html:'<span style="display:grid;place-items:center;background:#214b3d;color:white;border:2px solid white;border-radius:50%;width:30px;height:30px;box-shadow:0 1px 6px #0006;font-size:17px">◆</span>',iconSize:[30,30],iconAnchor:[15,15]});L.marker([h[0],h[1]],{icon}).addTo(habitatLayer).bindPopup('Hábitat de referencia: '+h[2]+' (punto ilustrativo, no avistamiento)')}document.getElementById('show-habitat').addEventListener('change',e=>{if(e.target.checked)habitatLayer.addTo(map);else map.removeLayer(habitatLayer)});
const bounds=L.latLngBounds([[-55.8,-76],[-43.5,-67]]);map.fitBounds(bounds,{padding:[10,10]});
try{
const taxon=await fetch('https://api.gbif.org/v1/species/match?name='+encodeURIComponent(name)).then(r=>{if(!r.ok)throw Error('taxon');return r.json()});if(!taxon.usageKey)throw Error('taxon');
const qs=new URLSearchParams({taxonKey:taxon.usageKey,hasCoordinate:'true',hasGeospatialIssue:'false',limit:'300',year:'2000,2026',decimalLatitude:'-55.8,-43.5',decimalLongitude:'-76,-67'});
const response=await fetch('https://api.gbif.org/v1/occurrence/search?'+qs).then(r=>{if(!r.ok)throw Error('records');return r.json()});
let count=0;const seen=new Set();
for(const o of response.results||[]){const lat=o.decimalLatitude,lon=o.decimalLongitude;if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat< -55.8||lat> -43.5||lon< -76||lon> -67)continue;
const key=lat.toFixed(3)+','+lon.toFixed(3);if(seen.has(key))continue;seen.add(key);
const marker=L.circleMarker([lat,lon],{radius:5,color:'#873d30',weight:1,fillColor:'#c86d50',fillOpacity:.8}).addTo(recordsLayer);
const popup=document.createElement('div');const strong=document.createElement('strong');strong.textContent=name;popup.append(strong,document.createElement('br'),document.createTextNode('Registro GBIF · '+(o.eventDate||'fecha no disponible')),document.createElement('br'));
const a=document.createElement('a');a.href='https://www.gbif.org/occurrence/'+encodeURIComponent(o.key);a.target='_blank';a.rel='noopener noreferrer';a.textContent='Ver registro original ↗';popup.append(a);marker.bindPopup(popup);count++}
status.textContent=count?'● '+count+' registros georreferenciados de GBIF (muestra, no distribución completa)':'No hay registros en esta muestra; no significa ausencia de la especie';
}catch(e){status.textContent='No se pudieron consultar los registros ahora. El mapa muestra solo geografía, no distribución de la especie.'}
setTimeout(()=>map.invalidateSize(),300);
})();
</script></body></html>
